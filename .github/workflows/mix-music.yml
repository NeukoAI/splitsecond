name: mix music
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [v2/mix.json, tools/mix_music.py]
permissions:
  contents: write
jobs:
  mix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: python3 tools/mix_music.py
      - name: publish to mixed branch
        run: |
          git config user.name "mix-music"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan mixed
          git rm -rq --cached . || true
          git add mixed
          git commit -qm "clips with the score mixed in"
          git push -f origin mixed
