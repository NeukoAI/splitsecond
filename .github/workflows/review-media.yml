name: review media
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [v2/media.json, tools/review_media.sh]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: tools/review_media.sh
      - name: publish to review-media branch
        run: |
          git config user.name "review-media"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan review-media
          git rm -rq --cached . || true
          git add review
          git commit -qm "review copies of v2 media"
          git push -f origin review-media
