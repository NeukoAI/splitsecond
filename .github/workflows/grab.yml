name: grab media
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [v2/grab.txt]
permissions:
  contents: write
jobs:
  grab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download every listed file
        run: |
          mkdir -p grab
          while read -r name url; do
            [ -z "$name" ] && continue
            curl -sSfL "$url" -o "grab/$name.${url##*.}" || echo "failed $name"
          done < v2/grab.txt
          ls -la grab
      - name: publish to grab branch
        run: |
          git config user.name "grab"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan grab
          git rm -rq --cached . || true
          git add grab
          git commit -qm "originals of listed media"
          git push -f origin grab
